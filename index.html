<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gridefy</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <strong>Gridefy</strong> · lives: <strong id="lives"></strong><br />
      Left-click: place · Right-click: delete<br />
      Left-drag: orbit · Right-drag: pan · Wheel: zoom<br />
      1: wall · 2: tower · building: <strong id="tool"></strong><br />
      F: toggle distance heatmap<br />
      <span class="spawn">■</span> spawn · <span class="base">■</span> base ·
      <span class="path">■</span> path: <span id="pathinfo"></span>
    </div>
    <div id="msg"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
